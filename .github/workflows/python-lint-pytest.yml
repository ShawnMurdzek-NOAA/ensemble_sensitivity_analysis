# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python Lint and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.14.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.14.10"
    - uses: conda-incubator/setup-miniconda@v3
    - name: Install dependencies
      run: |
        conda env create --file environment.yml --name py_env
    - name: Lint with flake8
      run: |
        # stop if there are Python syntax errors or undefined names
        conda run -n py_env flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        conda run -n py_env flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        source $CONDA/etc/profile.d/conda.sh
        conda activate py_env
        export PYTHONPATH=$PYTHONPATH:/home/runner/work/ensemble_sensitivity_analysis/
        echo $PYTHONPATH
        cd ./test
        pytest --ignore=./data
